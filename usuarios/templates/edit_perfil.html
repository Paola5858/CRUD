{% extends 'base_optimized.html' %}

{% block content %}
<div style="padding: 40px;">
    <h1>Editar Perfil</h1>
    <div style="background: #1a1a1a; padding: 30px; border-radius: 12px; margin-top: 20px; max-width: 600px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="background: #ff6b00; padding: 12px 24px; border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer;">
                Salvar Alterações
            </button>
            <a href="{% url 'profile' %}" style="background: #333; padding: 12px 24px; border-radius: 8px; color: #fff; text-decoration: none; margin-left: 10px; display: inline-block;">
                Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
