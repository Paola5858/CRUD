{% extends 'base.html' %}

{% block content %}
<h1>Dados dos Sensores</h1>
<a href="{% url 'sensores:criar_dados' %}" class="btn btn-primary">Criar Dados</a>
<ul>
{% for dado in objects %}
    <li>{{ dado.motor.nome }} - {{ dado.sensor.nome }}: {{ dado.valor }} {{ dado.sensor.unidade }} em {{ dado.timestamp }}
        <a href="{% url 'sensores:atualizar_dados' dado.pk %}">Editar</a>
        <a href="{% url 'sensores:deletar_dados' dado.pk %}">Deletar</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
