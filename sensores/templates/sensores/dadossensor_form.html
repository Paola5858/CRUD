{% extends 'base_dashboard.html' %}

{% block title %}MOTOSENSE - {% if object %}Editar{% else %}Novo{% endif %} Dado{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if object %}Editar Dado{% else %}Novo Dado{% endif %}</h1>
</div>

<div class="form-container">
    <form method="post" class="crud-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_motor">Motor:</label>
            <select name="motor" id="id_motor" required>
                <option value="">Selecione um motor</option>
                {% for motor in form.motor.field.queryset %}
                <option value="{{ motor.id }}" {% if form.motor.value == motor.id %}selected{% endif %}>{{ motor.nome }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="id_sensor">Sensor:</label>
            <select name="sensor" id="id_sensor" required>
                <option value="">Selecione um sensor</option>
                {% for sensor in form.sensor.field.queryset %}
                <option value="{{ sensor.id }}" {% if form.sensor.value == sensor.id %}selected{% endif %}>{{ sensor.tipo }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="id_valor">Valor:</label>
            <input type="number" step="0.01" name="valor" id="id_valor" value="{{ form.valor.value|default:'' }}" required>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'sensores:listar_dados' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

<style>
.form-container { max-width: 600px; margin: 20px; padding: 20px; background: #1a1a1a; border-radius: 8px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; color: #ff6b00; }
.form-group input, .form-group select { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { padding: 10px 20px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
.btn-primary { background: #ff6b00; color: white; }
.btn-secondary { background: #666; color: white; }
</style>
{% endblock %}
