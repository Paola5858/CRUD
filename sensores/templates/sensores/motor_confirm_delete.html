{% extends 'base_dashboard.html' %}

{% block content %}
<div class="page-header">
    <h1>Deletar Motor</h1>
</div>

<div class="form-container">
    <div class="delete-warning">
        <h2>⚠️ Confirmação</h2>
        <p>Tem certeza que deseja deletar o motor <strong>{{ object.nome }}</strong>?</p>
        <p>Esta ação não pode ser desfeita.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <a href="{% url 'sensores:listar_motor' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Deletar</button>
        </div>
    </form>
</div>
{% endblock %}
