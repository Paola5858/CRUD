{% extends 'sensores/base.html' %}

{% block content %}
<h1>Sensores</h1>
<a href="{% url 'sensores:criar_sensor' %}" class="btn btn-primary mb-3">Novo Sensor</a>
<ul class="list-group">
    {% for sensor in sensor_list %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ sensor.tipo }}
            <div>
                <a href="{% url 'sensores:atualizar_sensor' sensor.pk %}" class="btn btn-secondary btn-sm">Editar</a>
                <a href="{% url 'sensores:deletar_sensor' sensor.pk %}" class="btn btn-danger btn-sm">Deletar</a>
            </div>
        </li>
    {% endfor %}
</ul>
{% endblock %}
