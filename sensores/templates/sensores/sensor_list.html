{% extends 'base.html' %}

{% block content %}
<h1>Sensores</h1>
<a href="{% url 'sensores:criar_sensor' %}" class="btn btn-primary">Criar Sensor</a>
<ul>
{% for sensor in objects %}
    <li>{{ sensor.nome }} - {{ sensor.tipo }} - {{ sensor.unidade }}
        <a href="{% url 'sensores:atualizar_sensor' sensor.pk %}">Editar</a>
        <a href="{% url 'sensores:deletar_sensor' sensor.pk %}">Deletar</a>
    </li>
{% endfor %}
</ul>
{% endblock %}
