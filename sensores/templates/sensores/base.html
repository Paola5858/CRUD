<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %} {% endblock %} </title>
    {% load static %}
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
    <header>
        <div class="left">
            <img src="{% static 'images/logo.png' %}" alt="Logo do Projeto Motores" width="60" height="60">
            <span class="project-name">MOTOSENSE</span>
        </div>
        <div class="right">
            <a href="">Sensores</a>
            <a href="">Motores</a>
            <a href="">Dados</a>
        </div>
        <div class="py-3 text-center">
            <h1>🏎️ Projeto Motores</h1>
            <p class="lead">Monitoramento de motores e sensores</p>
        </div>
    </header>
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/">🏎️ Projeto Motores</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'sensores:listar_motor' %}">Motores</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'sensores:listar_sensor' %}">Sensores</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'sensores:listar_dados' %}">Dados</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        {% block content %}{% endblock %}
    </div>
    <footer class="bg-light text-center py-3 mt-4">
        <p class="mb-0">&copy; 2025 Projeto Motores. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
