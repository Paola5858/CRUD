{% extends 'base_dashboard.html' %}

{% block content %}
<div class="page-header">
    <h1>Deletar Sensor</h1>
</div>

<div class="form-container">
    <div class="delete-warning">
        <h2>⚠️ Confirmação</h2>
        <p>Tem certeza que deseja deletar o sensor <strong>{{ object.tipo }}</strong>?</p>
        <p>Esta ação não pode ser desfeita.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <a href="{% url 'sensores:listar_sensor' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-danger">Deletar</button>
        </div>
    </form>
</div>

<style>
.delete-warning { background: rgba(255, 0, 0, 0.1); border: 1px solid rgba(255, 0, 0, 0.3); padding: 20px; border-radius: 8px; margin-bottom: 20px; }
.btn-danger { background: #dc3545; color: white; }
</style>
{% endblock %}
