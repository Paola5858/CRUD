{% extends 'sensores/base.html' %}

{% block content %}
<div class="container">
  <h1>Dados</h1>
  <a href="{% url 'sensores:criar_dados' %}" class="btn btn-primary mb-3">Adicionar Dados</a>
  <ul class="list-group">
  {% for dado in dados_list %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
          {{ dado.motor.nome }} - {{ dado.sensor.tipo }}: {{ dado.valor }} ({{ dado.data_hora|date:"d/m/Y H:i" }})
          <div>
              <a href="{% url 'sensores:atualizar_dados' dado.pk %}" class="btn btn-secondary btn-sm">Editar</a>
              <a href="{% url 'sensores:deletar_dados' dado.pk %}" class="btn btn-danger btn-sm">Deletar</a>
          </div>
      </li>
  {% endfor %}
  </ul>
</div>
{% endblock %}
