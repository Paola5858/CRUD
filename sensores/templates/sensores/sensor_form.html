{% extends 'base_dashboard.html' %}

{% block content %}
<div class="page-header">
    <h1>{% if object %}Editar Sensor{% else %}Novo Sensor{% endif %}</h1>
</div>

<div class="form-container">
    <form method="post" class="crud-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_tipo">Tipo:</label>
            <input type="text" name="tipo" id="id_tipo" value="{{ form.tipo.value|default:'' }}" required>
        </div>
        
        <div class="form-group">
            <label for="id_precisao">Precisão:</label>
            <input type="number" step="0.01" name="precisao" id="id_precisao" value="{{ form.precisao.value|default:'' }}" required>
        </div>
        
        <div class="form-actions">
            <a href="{% url 'sensores:listar_sensor' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
    </form>
</div>

<style>
.form-container { max-width: 600px; margin: 20px; padding: 20px; background: #1a1a1a; border-radius: 8px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; margin-bottom: 5px; color: #ff6b00; }
.form-group input { width: 100%; padding: 10px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
.form-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { padding: 10px 20px; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
.btn-primary { background: #ff6b00; color: white; }
.btn-secondary { background: #666; color: white; }
</style>
{% endblock %}
