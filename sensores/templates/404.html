{% extends 'sensores/base.html' %}

{% block title %}Página não encontrada - MOTOSENSE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <div class="mb-4">
                    <i class="fas fa-exclamation-triangle fa-5x text-warning"></i>
                </div>
                <h1 class="display-4 text-muted">404</h1>
                <h3 class="mb-3">Página não encontrada</h3>
                <p class="text-muted mb-4">
                    A página que você está procurando não existe ou foi movida.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Ir para Dashboard
                    </a>
                    <button onclick="history.back()" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
