{% extends 'sensores/base.html' %}

{% block title %}MOTOSENSE - Formulário Sensor{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2 class="title title-md">Formulário de Sensor</h2>
        
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div style="margin-top: var(--space-lg);">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="{% url 'sensores:listar_sensor' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
