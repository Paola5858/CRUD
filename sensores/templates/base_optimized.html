<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MOTOSENSE - Sistema de Controle de Motores">
    <title>{% block title %}MOTOSENSE{% endblock %}</title>
    
    <!-- Preload critical resources -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" as="style">
    
    {% load static %}
    
    <!-- Critical CSS inline -->
    <style>
        :root{--primary:#ff6b00;--black:#000;--dark:#0d0d0d;--text:#fff}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--text);line-height:1.5}
        .loading{opacity:0.7;pointer-events:none}
    </style>
    
    <!-- Main CSS with cache busting -->
    <link rel="stylesheet" href="{% static 'css/motosense-core.css' %}?v={{ css_version|default:'1.0' }}">
    
    {% block extra_css %}{% endblock %}
    
    <!-- Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
</head>
<body>
    <!-- Loading indicator -->
    <div id="loadingIndicator" class="loading-overlay" style="display:none;">
        <div class="loading-spinner"></div>
    </div>
    
    {% block content %}{% endblock %}
    
    <!-- Core JavaScript -->
    <script>
        // Critical JS inline
        window.MOTOSENSE_CONFIG = {
            DEBUG: {% if debug %}true{% else %}false{% endif %},
            CSRF_TOKEN: '{{ csrf_token }}',
            VERSION: '{{ js_version|default:"1.0" }}'
        };
        
        // Loading utilities
        function showLoading() {
            document.getElementById('loadingIndicator').style.display = 'flex';
        }
        
        function hideLoading() {
            document.getElementById('loadingIndicator').style.display = 'none';
        }
        
        // Performance monitoring
        if (window.performance && window.performance.mark) {
            window.performance.mark('motosense-start');
        }
    </script>
    
    <!-- Chart.js local with error handling -->
    <script src="{% static 'js/chart.min.js' %}?v={{ js_version|default:'1.0' }}" 
            onerror="console.error('Erro ao carregar Chart.js local')" defer></script>
    
    {% block extra_js %}{% endblock %}
    
    <!-- Performance end mark -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (window.performance && window.performance.mark) {
                window.performance.mark('motosense-end');
                window.performance.measure('motosense-load', 'motosense-start', 'motosense-end');
            }
            hideLoading();
        });
    </script>
</body>
</html>
