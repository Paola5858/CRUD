{% extends 'sensores/base.html' %}

{% block title %}Erro interno - MOTOSENSE{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card">
            <div class="card-body py-5">
                <div class="mb-4">
                    <i class="fas fa-bug fa-5x text-danger"></i>
                </div>
                <h1 class="display-4 text-muted">500</h1>
                <h3 class="mb-3">Erro interno do servidor</h3>
                <p class="text-muted mb-4">
                    Ocorreu um erro interno. Nossa equipe foi notificada e está trabalhando para resolver.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="{% url 'dashboard:index' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Ir para Dashboard
                    </a>
                    <button onclick="location.reload()" class="btn btn-secondary">
                        <i class="fas fa-redo"></i> Tentar novamente
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
